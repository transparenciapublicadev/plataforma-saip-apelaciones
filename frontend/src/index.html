<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TTAIP - Sistema de Acceso a la Información Pública</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('saip-theme') || localStorage.getItem('saip-theme-mode');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const useDark = saved === 'dark' || (!saved && prefersDark);
        document.documentElement.classList.toggle('dark', useDark);
        document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
      } catch {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
  <app-root></app-root>
</body>
</html>
