<div class="saip-page min-h-screen bg-background">
  <div class="relative bg-paper border-b border-border overflow-hidden">
    <div class="absolute top-0 right-0 w-[480px] h-[480px] rounded-full opacity-[0.05] -translate-y-1/3 translate-x-1/4 pointer-events-none" style="background: radial-gradient(circle, var(--brand-600), transparent 70%)"></div>
    <div class="absolute bottom-0 left-0 right-0 h-[3px]" style="background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent); opacity: 0.35"></div>
    <div class="relative max-w-7xl mx-auto px-6 md:px-10 pt-28 pb-10">
      <a [routerLink]="panel" class="inline-flex items-center gap-1.5 text-sm font-medium mb-4 hover:underline" style="color: var(--brand-700)">
        <svg lucideArrowLeft class="w-4 h-4" aria-hidden="true"></svg>
        Mi panel
      </a>
      <span class="eyebrow">Apelaciones y comunicaciones</span>
      <h1 class="font-display mt-1" style="font-size: clamp(32px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.025em">
        Actuaciones del <span class="italic" style="color: var(--brand-700)">Tribunal</span>
      </h1>
      <p class="mt-3 max-w-2xl text-sm text-muted-foreground leading-relaxed">
        Escritos, actuaciones y comunicaciones que el Tribunal registró en sus expedientes.
      </p>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 md:px-10 py-8">
    <section class="form-shell">
      <div class="form-section-header flex items-center gap-3">
        <div class="w-9 h-9 rounded-md flex items-center justify-center shrink-0" style="background: var(--brand-subtle); border: 1px solid var(--brand-200)">
          <svg lucideGavel class="w-4 h-4" style="color: var(--brand-700)" aria-hidden="true"></svg>
        </div>
        <div>
          <span class="eyebrow">Bandeja</span>
          <h2 class="font-display" style="font-size: 17px; letter-spacing: -0.01em">Comunicaciones del Tribunal</h2>
        </div>
      </div>
      <div class="p-4 md:p-5">
        <app-bandeja-tribunal [integrada]="true" [entidad]="entidad" />
      </div>
    </section>
  </div>
</div>
