user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    map $host $yaiku_host_authorized {
        default 0;
        "@YAIKU_PUBLIC_HOST@" 1;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No request paths, queries, bodies, Bearer tokens or personal data in access logs.
    access_log off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    client_max_body_size 11m;
    client_body_timeout 60s;
    send_timeout 120s;
    server {
        listen 8081;
        location = /healthz { access_log off; return 200 'proxy ready\n'; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        if ($yaiku_host_authorized = 0) { return 421; }
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control 'private, no-store' always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # One attempt only: never replay a POST because an upstream response was lost.
        proxy_next_upstream off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        location ~ ^/(v3/api-docs|swagger-ui|swagger-ui.html|h2-console)(/|$) { return 404; }
        location ~ ^/api(?:/|$) {
            set $api http://backend:8080;
            proxy_request_buffering on;
            proxy_pass $api;
        }
        location / {
            set $ssr http://frontend:4000;
            proxy_pass $ssr;
        }
    }
}
