name: ${COMPOSE_PROJECT_NAME:?Use a unique yaiku- project name}

x-logs: &logs
  driver: local
  options: { max-size: '5m', max-file: '3' }

services:
  db:
    platform: linux/amd64
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_ADMIN_PASSWORD
      DB_APP_USER: ${DB_APP_USER:?Non-superuser application role required}
      TZ: America/Lima
    secrets: [DB_ADMIN_PASSWORD, DB_PASSWORD]
    # PostgreSQL18 stores version-specific data below /var/lib/postgresql.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    mem_limit: 768m
    shm_size: 128m
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logs

  backend:
    platform: linux/amd64
    image: ${BACKEND_IMAGE:-yaiku-backend:prepared}
    build: { context: ../../backend }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Required}
      DB_USERNAME: ${DB_APP_USER:?Required}
      APP_STORAGE_PROVIDER: s3-compatible
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:?Backend S3 endpoint required}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:?Bucket region required}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:?Private bucket required}
      APP_STORAGE_S3_FORCE_PATH_STYLE: 'true'
      APP_STORAGE_MAX_FILE_SIZE: '10485760'
      APP_STORAGE_MAX_REQUEST_SIZE: '11534336'
      CORS_ALLOWED_ORIGIN_PATTERNS: ${PUBLIC_ORIGIN:?HTTPS origin required}
      APP_NOTIFICATIONS_MODE: SMTP
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Real SMTP required by prod; do not use a dummy}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Real SMTP user required}
      APP_NOTIFICATIONS_MAIL_FROM: ${APP_NOTIFICATIONS_MAIL_FROM:?Verified sender required}
      SPRING_MAIL_SMTP_AUTH: 'true'
      SPRING_MAIL_SMTP_STARTTLS: 'true'
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: 'true'
      APP_NOTIFICATIONS_PUSH_ENABLED: 'false'
      SPRINGDOC_API_DOCS_ENABLED: 'false'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'false'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      TZ: America/Lima
    secrets:
      - DB_PASSWORD
      - source: JWT_SECRET
        target: jwt.secret
      - APP_STORAGE_S3_ACCESS_KEY
      - APP_STORAGE_S3_SECRET_KEY
      - SPRING_MAIL_PASSWORD
    networks: [database, application]
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 1280m
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logs

  frontend:
    platform: linux/amd64
    image: ${FRONTEND_IMAGE:-yaiku-frontend:prepared}
    build: { context: ../../frontend }
    environment:
      API_INTERNAL_ORIGIN: http://backend:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?HTTPS origin required for SSR host validation}
      NODE_OPTIONS: --max-old-space-size=384
      TZ: America/Lima
    networks: [application]
    depends_on: { backend: { condition: service_healthy } }
    mem_limit: 512m
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logs

  proxy:
    platform: linux/amd64
    image: ${PROXY_IMAGE:-yaiku-proxy:prepared}
    build: { context: ./nginx }
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?HTTPS origin required for proxy host validation}
    # Loopback until a reviewed deployment explicitly selects a public bind.
    ports: ['${WEB_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-9443}:8443']
    networks: [application]
    secrets: [tls_cert, tls_key]
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    mem_limit: 96m
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777', '/var/cache/nginx:size=32m', '/var/run:size=4m']
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logs

networks:
  database: { internal: true }
  application: {}
volumes:
  postgres_data: {}
secrets:
  DB_ADMIN_PASSWORD: { file: '${YAIKU_SECRETS_DIR:?Required}/DB_ADMIN_PASSWORD' }
  DB_PASSWORD: { file: '${YAIKU_SECRETS_DIR:?External private directory required}/DB_PASSWORD' }
  JWT_SECRET: { file: '${YAIKU_SECRETS_DIR:?Required}/JWT_SECRET' }
  APP_STORAGE_S3_ACCESS_KEY: { file: '${YAIKU_SECRETS_DIR:?Required}/APP_STORAGE_S3_ACCESS_KEY' }
  APP_STORAGE_S3_SECRET_KEY: { file: '${YAIKU_SECRETS_DIR:?Required}/APP_STORAGE_S3_SECRET_KEY' }
  SPRING_MAIL_PASSWORD: { file: '${YAIKU_SECRETS_DIR:?Required}/SPRING_MAIL_PASSWORD' }
  tls_cert: { file: '${YAIKU_TLS_DIR:?External certificate directory required}/fullchain.pem' }
  tls_key: { file: '${YAIKU_TLS_DIR:?Required}/privkey.pem' }
