# PostgreSQL profile for controlled migration rehearsal.
# MySQL remains the default runtime until an explicit cutover PR.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Keep the current runtime behavior during rehearsal. Several legacy controllers
# still map lazy relations after the service transaction has completed.
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=false

# Do not auto-run data.sql or seed scripts in this profile. Execute
# database/postgres/script_saip_db_postgres.sql explicitly before startup.
spring.sql.init.mode=never
