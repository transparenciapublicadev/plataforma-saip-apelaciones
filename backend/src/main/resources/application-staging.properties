# Staging profile for S3/Supabase storage validation
pe.gob.saip.storage.provider=S3_COMPATIBLE
pe.gob.saip.storage.s3.endpoint=${SUPABASE_S3_ENDPOINT}
pe.gob.saip.storage.s3.region=${AWS_REGION:us-east-1}
pe.gob.saip.storage.s3.bucket-name=${SUPABASE_S3_BUCKET_NAME}
pe.gob.saip.storage.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
pe.gob.saip.storage.s3.secret-key=${SUPABASE_S3_SECRET_KEY}

# Mapeo a las propiedades del sistema oficiales para que StorageProperties y S3CompatibleStorageProvider funcionen
app.storage.provider=${pe.gob.saip.storage.provider}
app.storage.s3.endpoint=${pe.gob.saip.storage.s3.endpoint}
app.storage.s3.region=${pe.gob.saip.storage.s3.region}
app.storage.s3.bucket=${pe.gob.saip.storage.s3.bucket-name}
app.storage.s3.access-key=${pe.gob.saip.storage.s3.access-key}
app.storage.s3.secret-key=${pe.gob.saip.storage.s3.secret-key}
app.storage.s3.force-path-style=true

# Límites de tamaño para carga de archivos multipart a un máximo de 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.max-file-size=10485760

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

jwt.secret=${JWT_SECRET:saip-plataforma-jwt-secret-key-for-development-only-at-least-256-bits-long}
spring.jpa.open-in-view=false
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://yaiku-saip.brazilsouth.cloudapp.azure.com,http://localhost:4200,http://localhost:4000}
