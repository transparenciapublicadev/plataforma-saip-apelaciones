# Production profile: require externalized secrets and disable local conveniences.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Document binaries must use an externally managed path in production.
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:}
app.storage.max-file-size=${APP_STORAGE_MAX_FILE_SIZE:10485760}
app.storage.allowed-content-types=${APP_STORAGE_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,text/plain}
spring.servlet.multipart.max-file-size=${APP_STORAGE_MAX_FILE_SIZE:10485760}
spring.servlet.multipart.max-request-size=${APP_STORAGE_MAX_REQUEST_SIZE:11534336}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# MOCK is only for local development and Newman. Production defaults to SMTP.
app.notifications.mode=${APP_NOTIFICATIONS_MODE:SMTP}
app.notifications.mock.allow-forced-failure=false
app.notifications.mail.from=${APP_NOTIFICATIONS_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}

# FCM stays opt-in. Never version service-account JSON or the AES key used for token encryption.
app.notifications.push.enabled=${APP_NOTIFICATIONS_PUSH_ENABLED:false}
app.notifications.push.firebase.service-account-path=${FCM_FIREBASE_SERVICE_ACCOUNT_PATH:}
app.notifications.push.token-encryption-key-base64=${FCM_TOKEN_ENCRYPTION_KEY_BASE64:}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
spring.h2.console.enabled=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=WARN
