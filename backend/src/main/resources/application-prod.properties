# Production profile: require externalized secrets and disable local conveniences.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# MOCK is only for local development and Newman. Production defaults to SMTP.
app.notifications.mode=${APP_NOTIFICATIONS_MODE:SMTP}
app.notifications.mock.allow-forced-failure=false
app.notifications.mail.from=${APP_NOTIFICATIONS_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
spring.h2.console.enabled=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=WARN
