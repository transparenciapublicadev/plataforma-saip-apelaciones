spring.application.name=SAIP Backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saip_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:saip-plataforma-jwt-secret-key-for-development-only-at-least-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# RFC 9457 / Problem Details
spring.mvc.problemdetails.enabled=true


# CORS (dev defaults, override with CORS_ALLOWED_ORIGIN_PATTERNS)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:4201,http://localhost:4300,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:4300,http://127.0.0.1:5173,https://web.postman.co,https://*.postman.com,https://*.postman.co}

# Notification Engine Configuration
app.notifications.mode=${APP_NOTIFICATIONS_MODE:MOCK}
app.notifications.mail.from=${APP_NOTIFICATIONS_MAIL_FROM:no-reply@plataforma-saip.local}

# Spring Mail SMTP Configuration (Active when APP_NOTIFICATIONS_MODE=SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}

# Firebase Cloud Messaging adapter. Disabled until external credentials and Firebase Admin integration exist.
app.notifications.push.enabled=${APP_NOTIFICATIONS_PUSH_ENABLED:false}
app.notifications.push.firebase.service-account-path=${FCM_FIREBASE_SERVICE_ACCOUNT_PATH:}
app.notifications.push.token-encryption-key-base64=${FCM_TOKEN_ENCRYPTION_KEY_BASE64:}


