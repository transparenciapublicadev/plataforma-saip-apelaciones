spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

jwt.secret=saip-test-jwt-secret-key-for-unit-tests-minimum-256-bits-long-string
jwt.expiration-ms=3600000
app.notifications.mode=MOCK
app.notifications.mail.from=no-reply-test@plataforma-saip.local
app.notifications.push.enabled=false

app.storage.provider=local
app.storage.local.base-path=${java.io.tmpdir}/saip-storage-postgres-integration
app.storage.max-file-size=10485760
app.storage.allowed-content-types=application/pdf,image/png,image/jpeg,text/plain
spring.servlet.multipart.max-file-size=10485760
spring.servlet.multipart.max-request-size=11534336

# Enable Flyway for real PostgreSQL integration tests
spring.flyway.enabled=true

