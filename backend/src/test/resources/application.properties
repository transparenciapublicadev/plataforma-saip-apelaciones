# Test configuration — H2 in-memory (no requiere MySQL en CI)
spring.datasource.url=jdbc:h2:mem:saip_db_test;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Desactivar data.sql en tests (los tests configuran sus propios datos)
spring.sql.init.mode=never

# JWT test config
jwt.secret=saip-test-jwt-secret-key-for-unit-tests-minimum-256-bits-long-string
jwt.expiration-ms=3600000
spring.security.user.name=test
spring.security.user.password=test
