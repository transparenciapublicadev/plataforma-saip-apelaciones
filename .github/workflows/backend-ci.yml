name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    env:
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT || 'http://localhost:9000' }}
      SUPABASE_S3_BUCKET_NAME: ${{ secrets.SUPABASE_S3_BUCKET_NAME || 'test-bucket' }}
      SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY || 'dummy-access-key' }}
      SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY || 'dummy-secret-key' }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON || '{}' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build
        run: ./mvnw -B compile -DskipTests

      - name: Run tests
        run: ./mvnw -B test

      - name: Package (verify)
        run: ./mvnw -B package -DskipTests

      # OpenAPI spec — exportar para consumidores (frontend, mobile)
      - name: Generate OpenAPI spec
        run: |
          ./mvnw -B spring-boot:start -Dspring-boot.run.profiles=ci -Dspring.profiles.active=ci -Dpe.gob.saip.storage.provider=LOCAL 2>/dev/null &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              curl -s http://localhost:8080/v3/api-docs | python3 -m json.tool > openapi.json
              echo "OpenAPI spec generated successfully"
              break
            fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true
        continue-on-error: true

      - name: Upload OpenAPI spec
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: backend/openapi.json
          retention-days: 30
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
