name: Mobile CI

on:
  push:
    branches: [main, develop, 'daniel/**', 'kelly/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Build (Android / Kotlin)
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"
      ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-detect: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Pin Gradle toolchain path to installed JDK
        run: echo "ORG_GRADLE_PROJECT_org.gradle.java.installations.paths=$JAVA_HOME" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: mobile/app/build/reports/tests/
          retention-days: 7
